      summary: "Get all bot utilisation"
      operationId: "requestAllBotUtilisationNew"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/RequestAllBotUtilisation'
      responses:
        '200':
          description: "Bot utilisation data"
          content:
            application/json:
              schema:
                type: object
        '400':
          description: "Invalid input data"
        '500':
          description: "Internal server error"

  /requestBotUtilisationNew:
    post:
      tags:
        - "LogController"
      summary: "Get bot utilisation"
      operationId: "requestBotUtilisationNew"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/RequestBotUtilisation'
      responses:
        '200':
          description: "Bot utilisation data"
          content:
            application/json:
              schema:
                type: object
        '400':
          description: "Invalid input data"
        '500':
          description: "Internal server error"

  /filterLogsNew:
    post:
      tags:
        - "LogController"
      summary: "Filter logs (new)"
      operationId: "filterLogsNew"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/RequestUtilisationNew'
      responses:
        '200':
          description: "Filtered logs"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'common.yml#/components/schemas/ExecutionTimeDTO'
        '400':
          description: "Invalid input data"
        '500':
          description: "Internal server error"

  /filterLogs:
    post:
      tags:
        - "LogController"
      summary: "Filter logs"
      operationId: "filterLogs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/RequestUtilsation'
      responses:
        '200':
          description: "Filtered logs"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'common.yml#/components/schemas/ExecutionTimeDTO'
