  /deleteProcess/{id}:
    delete:
      tags:
        - "ProcessController"
      summary: "Delete a process"
      operationId: "deleteProcess"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: int
          description: "Process name"
      responses:
        '200':
          description: "Process deleted successfully"
          content:
            application/json:
              schema:
                type: string
        '404':
          description: "Process not found"
        '500':
          description: "Internal server error"

  /listProcess/{id}:
    get:
      tags:
        - "ProcessController"
      summary: "Get processes by bot name"
      operationId: "getProcesses"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: int
          description: "Bot name"
      responses:
        '200':
          description: "List of processes for the bot"
          content:
            application/json:
              schema:
                type: array
                items:
