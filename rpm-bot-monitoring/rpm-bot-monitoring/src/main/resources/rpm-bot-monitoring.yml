  /validateChecksum/{machineName}/{processName}/{processVersion}/{checksumId}/{fileName}:
    get:
      tags:
        - "ChecksumController"
      summary: "Validate checksum"
      operationId: "validateChecksum"
      parameters:
        - name: machineName
          in: path
          required: true
          schema:
            type: string
        - name: processName
          in: path
          required: true
          schema:
            type: string
        - name: processVersion
          in: path
          required: true
          schema:
            type: string
        - name: checksumId
          in: path
          required: true
          schema:
            type: string
        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Checksum validation result"
          content:
            application/json:
              schema:
                type: string
                enum: ["Matched", "Un-matched"]
        '400':
          description: "Invalid parameters"
        '500':
          description: "Internal server error"

  /getAllChecksumData:
    get:
      tags:
        - "ChecksumController"
      summary: "Get all checksum data"
      operationId: "getAllChecksumData"
      responses:
        '200':
          description: "List of all checksum data"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: "Internal server error"

  /api/session/validate:
    get:
      tags:
        - "SessionController"
      summary: "Validate current session and return user authentication status"
      description: "Frontend can call this endpoint to check if user is logged in and get session information"
      operationId: "validateSession"
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: false
          description: "Bearer token for authentication"
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: "Session is valid and active"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/SessionValidationResponse'
              example:
                authenticated: true
                username: "user@example.com"
                role: "ADMIN"
                remainingSessionTime: 25
                sessionTimeoutMinutes: 30
        '401':
          description: "Session expired or not authenticated"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/SessionValidationResponse'
              example:
                authenticated: false
                message: "Session expired due to inactivity"
                expired: true
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /api/session/check-admin:
    get:
      tags:
        - "SessionController"
      summary: "Check if user has admin role"
      description: "Validates session and checks if the authenticated user has ADMIN role"
      operationId: "checkAdminRole"
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: false
          description: "Bearer token for authentication"
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: "Admin role check successful"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/AdminCheckResponse'
              example:
                isAdmin: true
                authenticated: true
                role: "ADMIN"
        '401':
          description: "Session expired or not authenticated"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/AdminCheckResponse'
              example:
                isAdmin: false
                authenticated: false
                message: "No active session found"
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token authentication. Include the token in the Authorization header as 'Bearer <token>'"

