        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /updateProcess:
    post:
      tags:
        - "ProcessController"
      summary: "Update an existing process"
      operationId: "updateProcess"
      requestBody:
