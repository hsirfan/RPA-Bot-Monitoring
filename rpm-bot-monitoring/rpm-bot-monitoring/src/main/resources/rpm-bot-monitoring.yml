      summary: "Upload or update a file"
      operationId: "uploadFile"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - processName
                - processVersion
                - botName
              properties:
                file:
                  type: string
                  format: binary
                processName:
                  type: string
                processVersion:
                  type: string
                botName:
                  type: string
      responses:
        '200':
          description: "File uploaded successfully"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/UploadFileResponse'
        '400':
          description: "Invalid input data"
        '500':
          description: "Internal server error"

