      summary: "Get unique bot names"
      operationId: "getBotNames"
      responses:
        '200':
          description: "List of unique bot names"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: "Internal server error"

  /getDetailsLogByDateRange/{botName}/{startDate}/{endDate}:
    get:
      tags:
        - "LogController"
      summary: "Get unique bot names"
      operationId: "getDetailsLogByDateRange"
      parameters:
        - name: botName
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: path
          required: true
