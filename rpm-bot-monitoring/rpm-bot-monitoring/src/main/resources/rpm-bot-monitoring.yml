openapi: 3.0.1

info:
  title: RPM Bot Monitoring API
  version: 1.0.0
  description: API for RPM Bot Monitoring System

paths:
  /addBot:
    post:
      tags:
        - "BotController"
      summary: "Add a new bot"
      operationId: "saveBot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/BotDTO'
      responses:
        '200':
          description: "Bot added successfully"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/AddBotResponse'
        '400':
          description: "Invalid input data"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /updateBot:
    post:
      tags:
        - "BotController"
      summary: "Update an existing bot"
      operationId: "updateBot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/BotDTO'
      responses:
        '200':
          description: "Bot updated successfully"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/UpdateBotResponse'
        '400':
          description: "Invalid input data"
        '404':
          description: "Bot not found"
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /findAllBots:
    get:
      tags:
        - "BotController"
      summary: "Get all bots"
      operationId: "getAllBot"
      responses:
        '200':
          description: "List of all bots"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'common.yml#/components/schemas/BotDTO'
        '500':
          description: "Internal server error"

  /findAllBots/{id}:
    get:
      tags:
        - "BotController"
      summary: "Get bot by name"
      operationId: "getBot"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: int
          description: "Bot name"
      responses:
        '200':
          description: "Bot found"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/BotDTO'
        '404':
          description: "Bot not found"
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /deleteBot/{id}:
    delete:
      tags:
        - "BotController"
      summary: "Delete a bot"
      operationId: "deleteBot"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: int
          description: "Bot name"
      responses:
        '200':
          description: "Bot deleted successfully"
          content:
            application/json:
              schema:
                type: string
        '404':
          description: "Bot not found"
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /getBotStatus/{name}/{status}/{processName}/{lastrunTimeStamp}:
    get:
      tags:
        - "BotController"
      summary: "Update bot status"
      operationId: "getBotStatus"
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: path
          required: true
          schema:
            type: string
        - name: processName
          in: path
          required: true
          schema:
            type: string
        - name: lastrunTimeStamp
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Bot status updated successfully"
          content:
            application/json:
              schema:
                type: string
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /addApplicationUser:
    post:
      tags:
        - "UserController"
      summary: "Add a new application user"
      operationId: "adduser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/UserDTO'
      responses:
        '200':
          description: "User added successfully"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/UserResponse'
        '400':
          description: "Invalid input data"
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /findAllApplicationUsers:
    get:
      tags:
        - "UserController"
      summary: "Get all application users"
      operationId: "getAllUser"
      responses:
        '200':
          description: "List of all users"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'common.yml#/components/schemas/UserDTO'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /updateApplicationUser:
    post:
      tags:
        - "UserController"
      summary: "Update an existing user"
      operationId: "updateUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/UserDTO'
      responses:
        '200':
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/UserResponse'
        '400':
          description: "Invalid input data"
        '404':
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: 'common.yml#/components/schemas/Error'

  /addProcess:
    post:
      tags:
        - "ProcessController"
      summary: "Add a new process"
      operationId: "saveNewProcess"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'common.yml#/components/schemas/ProcessDTO'
      responses:
        '200':
          description: "Process added successfully"
          content:
            application/json:
