  /uploadLogFileNew:
    post:
      tags:
        - "LogController"
      summary: "Upload log file"
      operationId: "processLogFile"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: "Log file processed successfully"
          content:
            application/json:
              schema:
                type: string
        '400':
          description: "Invalid file"
        '500':
          description: "Internal server error"

  /uploadPythonLogFile:
    post:
      tags:
        - "LogController"
      summary: "Upload Python log file"
      operationId: "processPythonLogFile"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
