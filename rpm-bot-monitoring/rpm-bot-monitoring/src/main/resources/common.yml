openapi: 3.0.1

info:
  title: RPM Bot Monitoring Common Models
  version: 1.0.0
  description: Common data models for RPM Bot Monitoring System

paths: {}

components:
  schemas:
    BotDTO:
      type: object
      properties:
        botId:
          type: integer
          format: int64
        botName:
          type: string
        ip:
          type: string
        hostName:
          type: string
        licenceType:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        uiPathVersion:
          type: string
        softwareInstalled:
          type: string
        thresHoldTime:
          type: string
          format: date-time
        licenceKey:
          type: string
        licenceStartDate:
          type: string
          format: date-time
        licenceEndDate:
          type: string
          format: date-time
        random:
          type: string
        liveBotStatus:
          type: string
        processName:
          type: string
        machineName:
          type: string
        lastRunLogtimestamp:
          type: string
          format: date-time
        lastRunTimeStamp:
          type: string

    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employeeID:
          type: string
        userName:
          type: string
        domainName:
          type: string
        emailID:
          type: string
        mobileNo:
          type: string
        password:
          type: string
        process:
          type: array
          items:
            type: string
        bots:
          type: array
          items:
            type: string
        role:
          type: string

    ProcessDTO:
      type: object
      properties:
        processId:
          type: integer
          format: int64
        processName:
          type: string
        botName:
          type: array
          items:
            type: string
        productionMovedDate:
          type: string
          format: date
          example: "2025-12-01"
        processRequirements:
          type: string
        processOwnerName:
          type: string
        processOwnerContact:
          type: string
        processOwnerMailID:
          type: string
        processTeamMember:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        lastRunTimeStamp:
          type: string
        processLastRunTime:
          type: string
        processStatus:
          type: string

    TeamMember:
      type: object
      properties:
        name:
          type: string
        phoneNumber:
          type: string
        email:
          type: string

    AddProcessResponse:
      type: object
      properties:
        status:
          type: string
        processName:
          type: string
        id:
          type: integer

    AddBotResponse:
      type: object
      properties:
        status:
          type: string
        BotName:
          type: string
        id:
          type: integer

    UpdateBotResponse:
      type: object
      properties:
        status:
          type: string
        id:
          type: integer


    UserResponse:
      type: object
      properties:
        status:
          type: string
        id:
          type: integer

    LoginDTO:
      type: object
      properties:
        emailID:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDTO'

    ExecutionTimeDTO:
      type: object
      properties:
        logDate:
          type: string
        startTime:
          type: string
          format: date
          example: "2025-12-01"
        endTime:
          type: string
          format: date
          example: "2025-12-01"
        processName:
          type: string
        botName:
          type: string
        timeDifference:
          type: string
        logDateinLocalDate:
          type: string
          format: date
          example: "2025-12-01"
        startTimeinLocalDateTime:
          type: string
          format: date-time
        processStatus:
          type: string
        endTimeinLocalDateTime:
          type: string
          format: date-time
        errorMessage:
          type: array
          items:
            type: string
        machineName:
          type: string
        createdDate:
          type: string
          format: date-time
        jobId:
          type: String


    BotRequest:
      type: object
      properties:
        botName:
          type: array
          items:
            type: string

    RequestAllBotUtilisation:
      type: object
      properties:
        startTime:
          type: string
          format: date
          example: "2025-12-01"
        endTime:
          type: string
          format: date
          example: "2025-12-01"
        botName:
          type: array
          items:
            type: string

    RequestBotUtilisation:
      type: object
      properties:
        botName:
          type: string
        startTime:
          type: string
          format: date
        endTime:
          type: string
          format: date

    RequestUtilisationNew:
      type: object
      properties:
        botName:
          type: array
          items:
            type: string
        processName:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date
        endTime:
          type: string
          format: date
        status:
          type: array
          items:
            type: string
        scenario:
          type: string

    RequestUtilsation:
      type: object
      properties:
        botName:
          type: array
          items:
            type: string
        processName:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date
          example: "2025-12-01"
        endTime:
          type: string
          format: date
          example: "2025-12-01"
        status:
          type: array
          items:
            type: string
        scenario:
          type: string

    RequestPythonUtilisation:
      type: object
      properties:
        botName:
          type: string
        processName:
          type: string
        startTime:
          type: string
          format: date
        endTime:
          type: string
          format: date

    AllBotDetailUtilisationResponse:
      type: object
      properties:
        botName:
          type: string
        processName:
          type: string
        data:
          type: array
          items:
            type: integer
            format: int64

    UploadFileResponse:
      type: object
      properties:
        fileName:
          type: string
        fileDownloadUri:
          type: string
        fileType:
          type: string
        size:
          type: integer
          format: int64

    Error:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer

    SessionValidationResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        role:
          type: string
        remainingSessionTime:
          type: integer
          format: int64
        sessionTimeoutMinutes:
          type: integer
        message:
          type: string
        expired:
          type: boolean

    AdminCheckResponse:
      type: object
      properties:
        isAdmin:
          type: boolean
        authenticated:
          type: boolean
        role:
          type: string
        message:
          type: string

